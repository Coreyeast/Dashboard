# Add this service block to your main compose.yaml.
# Note: jellystat already uses port 3000, so the dashboard runs on 3001.

services:
  dashboard:
    build: ./homelab-dashboard
    container_name: homelab-dashboard
    ports:
      - "3001:3001"
    volumes:
      - /:/host:ro                              # Host root read-only (for storage stats)
      - ./homelab-dashboard/config:/app/config  # App config — edit apps.json here
    environment:
      - HOST_MOUNT=/host
      - NODE_ENV=production
      - PORT=3001
      # qBittorrent credentials — set these in your root .env file, never hardcode
      - QBIT_URL=${QBIT_URL}
      - QBIT_USERNAME=${QBIT_USERNAME}
      - QBIT_PASSWORD=${QBIT_PASSWORD}
    restart: unless-stopped
